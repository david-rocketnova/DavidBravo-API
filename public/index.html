<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>David Bravo - API</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f0f2f5;
      color: #222;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .contenedor {
      background: #ffffff;
      max-width: 700px;
      width: 100%;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    h1 {
      color: #2c3e50;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .autor {
      color: #2980b9;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .descripcion {
      line-height: 1.6;
      margin-bottom: 25px;
      color: #555;
    }

    button {
      background: #2980b9;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 30px;
      transition: background 0.3s;
    }

    button:hover {
      background: #1f6391;
    }

    h2 {
      color: #2c3e50;
      font-size: 20px;
      margin-bottom: 15px;
      border-bottom: 2px solid #ecf0f1;
      padding-bottom: 8px;
    }

    ul {
      list-style: none;
    }

    li {
      background: #ecf0f1;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <h1>API de David Bravo</h1>
    <p class="autor">David Bravo Bravo</p>

    <p class="descripcion">
      Proyecto de práctica con Node.js y Express. Este servidor expone varios
      endpoints (usuarios, productos y estado del servicio) y sirve esta página
      HTML como panel de inicio. Está desplegado en Render.
    </p>

    <button onclick="alert('¡Botón pulsado!')">Pulsa aquí</button>

    <h2>Usuarios</h2>
    <ul>
      <li>1 - Juan</li>
      <li>2 - Maria</li>
      <li>3 - Pedro</li>
    </ul>
  </div>
</body>
</html>
